name: CI

# GitHub Flow: main is always releasable; work happens in short-lived branches via PRs.
# Go: oldstable + stable (the two supported releases), plus the go.mod minimum for libraries.
# The ruleset requires ONE check, the "Required checks" gate at the end: jobs and the matrix can
# change without touching the ruleset. A new required job goes into the gate's `needs`.
# Every action is pinned by commit SHA with a version comment; Dependabot moves the SHA and the
# comment together (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # systray ships as pure Go; -race needs cgo and overrides this on its own step.
  CGO_ENABLED: "0"
  # Never download a newer Go behind our back: the job must run the Go it asked for, or
  # the minimum and oldstable tests prove nothing.
  GOTOOLCHAIN: local

jobs:
  # Compile every package, including the examples, on all three desktop OSes.
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Build all packages and examples
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov OIDC — only this job needs it
    strategy:
      # Each OS's -race result is separate evidence: with the default, one OS failing cancels
      # the others and their results never show (gogpu/ui#247, run 42469289570, 2026-11-08).
      # Never continue-on-error on a race step either: it hides a real race.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      # The build users ship: CGO_ENABLED=0, so goffi runs its fakecgo path.
      - name: Test
        shell: bash
        run: go test -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      # Race detection uses the toolchain's -race (ThreadSanitizer, needs cgo). With
      # CGO_ENABLED=1 goffi links the real runtime/cgo instead of its fakecgo, so this step
      # tests that path, not the one above.
      - name: Test (race)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          use_oidc: true
          files: ./coverage.txt

  # Libraries: the go.mod `go` line is a promise to every importer, and this machine never
  # tests it (it builds with GOTOOLCHAIN >= go1.27.3). This job tests exactly that line.
  test-minimum:
    name: Test - ubuntu-latest - Go minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gomod
        run: echo "go=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.gomod.outputs.go }}
          cache: true
      - run: go version
      - run: go test -count=1 ./...

  # 32-bit is a real target for a tray library: all three platforms build on linux/386.
  build-386:
    name: Build - linux 386
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: GOARCH=386 go build ./...
      - run: GOARCH=386 go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # The pinned golangci-lint (version and sha256 live in the action) comes from the
      # Actions cache, so lint does not depend on GitHub Releases being reachable on every
      # run. Bump golangci-lint in gogpu/.github, then move this pin. Keep lint-targets on
      # the same commit.
      - name: Set up golangci-lint
        uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --timeout=5m

  # Lint the files of the other GOOS too. The job above type-checks only linux files, so
  # code under darwin or windows build tags is never linted. With GOOS/GOARCH in the
  # environment and CGO off, go/packages loads exactly that target's files, and a target
  # that fails to type-check exits non-zero, never "0 issues". No macOS or Windows runner is
  # needed. One GOARCH per GOOS: no file in the module is arch-specific.
  lint-targets:
    name: Lint - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - uses: gogpu/.github/actions/setup-golangci-lint@cdb7bd4a5bd3852541a05f0fa1fa92b09d1ee732 # main 2026-11-08, golangci-lint v2.15.0
      # GOOS/GOARCH only on the lint step: the binary above stays linux/amd64.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        with:
          install-mode: none
          args: --timeout=5m

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # stable, never the go.mod minimum: gofmt's output changes between Go releases.
          go-version: stable
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          # tools/ is a separate module; tidy it too when present.
          if [ -f tools/go.mod ]; then go -C tools mod tidy; fi
          if [ -n "$(git status --porcelain -- go.mod go.sum tools/go.mod tools/go.sum)" ]; then
            echo "go mod tidy changed go.mod/go.sum (a new untracked go.sum counts):"
            git status --porcelain -- go.mod go.sum tools/go.mod tools/go.sum
            git diff -- go.mod go.sum tools/go.mod tools/go.sum; exit 1
          fi

  # Informational: reports what is outdated, never fails the run. Ecosystem dependencies
  # move only to released versions, and goffi moves through its own release train.
  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      # go-mod-outdated is pinned in tools/go.mod (checksums in tools/go.sum, updated by
      # Dependabot), never installed @latest.
      - name: Check direct dependencies for updates
        run: |
          echo "## Direct Dependencies with Available Updates"
          go list -u -m -json all | go tool -modfile=tools/go.mod go-mod-outdated -update -direct
      - name: Check ecosystem dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Ecosystem Dependencies"
          check_ecosystem_dep() {
            local DEP=$1 REPO=$2
            LOCAL=$(grep "$DEP" go.mod | grep -v "^module" | awk '{print $2}')
            [ -z "$LOCAL" ] && return 0
            LATEST=$(gh release view --repo "$REPO" --json tagName -q '.tagName' || echo "")
            [ -z "$LATEST" ] && { echo "  $DEP: $LOCAL (cannot verify)"; return 0; }
            if [ "$LOCAL" = "$LATEST" ]; then
              echo "  $DEP: $LOCAL"
            else
              echo "  $DEP: $LOCAL -> $LATEST available"
            fi
          }
          check_ecosystem_dep "github.com/go-webgpu/goffi" "go-webgpu/goffi"
          check_ecosystem_dep "github.com/godbus/dbus/v5" "godbus/dbus"

  # Informational: not in the gate, so a new CVE in a dependency does not block unrelated
  # PRs. A red run is still treated as a task (fix or report). It stays on the latest
  # govulncheck on purpose: the vulnerability data must be current.
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable

  # The one required check. `if: always()` and the explicit result check matter: a job that
  # is skipped (for example because a job it needs failed) counts as passed for a required
  # check, so a gate without them can let a red PR through.
  required:
    name: Required checks
    if: always()
    needs: [build, test, test-minimum, build-386, lint, lint-targets, formatting]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then echo "a required job ended with: $r"; exit 1; fi
          done
